name: 'Mirror repo'
description: "Mirror an org's repos (git refs, optionally releases and their files) from one hosting platform to another, in parallel, skipping repos already up to date (via funmirror)"
inputs:
  src:
    description: 'Source, format: <platform>/<org>. platform is one of github/gitee/gitlab/gitcode. e.g. github/kunpengcompute'
    required: true
  dst:
    description: 'Destination, format: <platform>/<org>. Same platform values as src.'
    required: true
  src_token:
    description: 'API token for the source platform (list repos, private repo clone)'
    required: false
    default: ''
  dst_token:
    description: 'API token for the destination platform (look up / create repos)'
    required: false
    default: ''
  src_key:
    description: 'SSH private key for the source platform, only required when the src platform is gitee'
    required: false
    default: ''
  dst_key:
    description: 'SSH private key for the destination platform, only required when the dst platform is gitee'
    required: false
    default: ''
  src_endpoint:
    description: 'Self-hosted endpoint for the source platform, only used when the src platform is gitlab'
    required: false
    default: ''
  dst_endpoint:
    description: 'Self-hosted endpoint for the destination platform, only used when the dst platform is gitlab'
    required: false
    default: ''
  repo-names:
    description: 'Comma-separated repo names to mirror; if empty, mirrors every repo in src'
    required: false
    default: ''
  force:
    description: 'Force-push mirrored refs, overwriting divergent history on the destination'
    required: false
    default: 'true'
  workers:
    description: 'Number of repos to mirror concurrently (clone+push phase)'
    required: false
    default: '8'
  detect-workers:
    description: >-
      Concurrency for the read-only commit-id detection phase that runs
      before the clone+push phase. Defaults to max(workers*4, 16). Keep
      workers low to protect a rate-limited destination while detection
      still runs fast, since it never touches git.
    required: false
    default: ''
  state-file:
    description: >-
      Path (relative to the workspace) to a JSON file mapping repo name to
      last-synced source branch sha. Read at the start and rewritten at the
      end with every processed repo's confirmed sha. Leave empty to disable
      state tracking. Persisting this file across runs (e.g. committing it
      back to the calling repo) is the caller's responsibility.
    required: false
    default: ''
  incremental:
    description: >-
      When "true" and state-file is set, skip repos whose current source sha
      still matches state-file without ever querying the destination
      platform. Leave "false" for a full sync that always checks the
      destination and refreshes state-file from the confirmed results.
    required: false
    default: 'false'
  sync-releases:
    description: >-
      When "true", also mirror releases and the files attached to them, in a
      pass that runs after the git push. Needs dst_token (the SSH key only
      covers git, not the REST API). Currently github -> gitee only; any
      other pair fails up front. Note that this makes every selected repo
      pay a release listing on both sides every run, including repos whose
      commits are unchanged -- publishing a release moves a tag, not the
      default branch, so skipping those on the commit sha alone would miss
      exactly what this switch is for.
    required: false
    default: 'false'
  release-limit:
    description: >-
      Only mirror the N most recent releases per repo. Empty or "0" means all
      of them, which on a repo with a long history of large binaries makes
      the first run move all of it.
    required: false
    default: ''
outputs:
  mirrored:
    description: 'Number of repos actually mirrored (excludes skipped repos that were already up to date)'
    value: ${{ steps.mirror.outputs.mirrored }}
  skipped:
    description: 'Number of repos skipped because they were already up to date'
    value: ${{ steps.mirror.outputs.skipped }}
  failed:
    description: 'Number of repos that failed to mirror'
    value: ${{ steps.mirror.outputs.failed }}
  total:
    description: 'Number of repos attempted'
    value: ${{ steps.mirror.outputs.total }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install funmirror
      shell: bash
      run: |
        set -euo pipefail
        PKG="git+https://github.com/farfarfun/funmirror.git@v0.6.0"

        # uv when it's there, pip when it isn't. Nearly all of `pip install
        # git+...` is PEP 517 build isolation — standing up a throwaway venv
        # and putting hatchling in it — plus resolving four dependencies one
        # after another; uv does the same work in a fraction of the time.
        #
        # Not worth fetching uv over the network to get that, though: this
        # action exists because reaching the far side is unreliable, and
        # trading a few seconds for one more thing that can fail to download
        # is a bad swap. So if the runner image doesn't ship uv, use pip and
        # move on.
        #
        # As of 2026-10-14 ubuntu-latest does not ship it, so in practice this
        # always takes the pip branch and costs ~8s. Kept anyway: it's free
        # when the image does start carrying uv, and the fallback is the path
        # that was already there.
        if command -v uv >/dev/null 2>&1; then
          uv pip install --system --quiet "$PKG"
        else
          echo "uv not on this runner, falling back to pip"
          pip install --quiet "$PKG"
        fi

    - id: mirror
      shell: bash
      env:
        SRC: ${{ inputs.src }}
        DST: ${{ inputs.dst }}
        SRC_KEY: ${{ inputs.src_key }}
        DST_KEY: ${{ inputs.dst_key }}
      run: |
        set -euo pipefail

        src_platform="${SRC%%/*}"
        src_org="${SRC#*/}"
        dst_platform="${DST%%/*}"
        dst_org="${DST#*/}"

        src_key_file=""
        dst_key_file=""

        if [[ "$src_platform" == "gitee" || "$dst_platform" == "gitee" ]]; then
          mkdir -p "$HOME/.ssh"
          # 重试 + 留话。这一行原本是 `ssh-keyscan ... >> known_hosts 2>/dev/null`，
          # 连不上时 ssh-keyscan 等满 5 秒超时再 exit 1，`set -e` 当场结束整步，而
          # 2>/dev/null 把唯一的线索也扔了——日志里只剩一个没有上文的 ##[error]。
          # 一次到 gitee.com:22 的瞬断就能让一百多个仓库整轮不动且查不出原因，
          # 2026-10-13 15:57 那轮就是这么没的（步骤耗时 6.017s = 5s 超时 + 启动）。
          #
          # 另外不能直接 `>>`：keyscan 失败时输出为空，空内容追加进去一声不响，
          # 真正的报错要等到后面每个仓库 push 时才以 host key 验证失败的形式冒出来。
          # 先落临时文件、确认非空再追加。
          keyscan_out="$RUNNER_TEMP/gitee_hostkeys"
          keyscan_err="$RUNNER_TEMP/gitee_keyscan.err"
          # 超时的那一路 ssh-keyscan 什么都不往 stderr 写——而超时恰恰是最常见的
          # 失败形态，照抄 stderr 等于还是没有线索，所以空输出要自己说明。
          why() {
            if [[ -s "$keyscan_err" ]]; then
              sed 's/^/  ssh-keyscan: /' "$keyscan_err" >&2
            else
              echo "  ssh-keyscan: 无输出，按 -T 10 判定为连接超时（gitee.com:22 不可达）" >&2
            fi
          }
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -t rsa,ed25519 gitee.com > "$keyscan_out" 2> "$keyscan_err" \
               && [[ -s "$keyscan_out" ]]; then
              cat "$keyscan_out" >> "$HOME/.ssh/known_hosts"
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::取不到 gitee.com 的 host key，三次都失败。没有它后面每个仓库的 push 都会在 host key 验证上失败，这里直接停。"
              why
              exit 1
            fi
            echo "::warning::第 $attempt 次取 gitee.com host key 失败，$((attempt * 5)) 秒后重试"
            why
            sleep $((attempt * 5))
          done
        fi

        if [[ -n "$SRC_KEY" ]]; then
          src_key_file="$RUNNER_TEMP/mirror_src_key"
          printf '%s\n' "$SRC_KEY" > "$src_key_file"
          chmod 600 "$src_key_file"
        fi

        if [[ -n "$DST_KEY" ]]; then
          dst_key_file="$RUNNER_TEMP/mirror_dst_key"
          printf '%s\n' "$DST_KEY" > "$dst_key_file"
          chmod 600 "$dst_key_file"
        fi

        force_flag="--force"
        [[ "${{ inputs.force }}" == "true" ]] || force_flag="--no-force"

        incremental_flag=""
        [[ "${{ inputs.incremental }}" == "true" ]] && incremental_flag="--incremental"

        releases_flag="--no-sync-releases"
        [[ "${{ inputs.sync-releases }}" == "true" ]] && releases_flag="--sync-releases"

        detect_workers_args=()
        [[ -n "${{ inputs.detect-workers }}" ]] && detect_workers_args=(--detect-workers "${{ inputs.detect-workers }}")

        release_limit_args=()
        [[ -n "${{ inputs.release-limit }}" ]] && release_limit_args=(--release-limit "${{ inputs.release-limit }}")

        set +e
        funmirror mirror \
          --src-platform "$src_platform" --dst-platform "$dst_platform" \
          --src-org "$src_org" --dst-org "$dst_org" \
          --src-token "${{ inputs.src_token }}" --dst-token "${{ inputs.dst_token }}" \
          --src-key-file "$src_key_file" --dst-key-file "$dst_key_file" \
          --src-endpoint "${{ inputs.src_endpoint }}" --dst-endpoint "${{ inputs.dst_endpoint }}" \
          --repo-names "${{ inputs.repo-names }}" \
          --workers "${{ inputs.workers }}" \
          "${detect_workers_args[@]}" \
          "${release_limit_args[@]}" \
          --state-file "${{ inputs.state-file }}" \
          $force_flag $incremental_flag $releases_flag
        status=$?
        set -e

        exit "$status"
