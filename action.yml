name: 'Mirror repo'
description: "Mirror an org's repos from one hosting platform to another, in parallel, skipping repos already up to date (via funmirror)"
inputs:
  src:
    description: 'Source, format: <platform>/<org>. platform is one of github/gitee/gitlab/gitcode. e.g. github/kunpengcompute'
    required: true
  dst:
    description: 'Destination, format: <platform>/<org>. Same platform values as src.'
    required: true
  src_token:
    description: 'API token for the source platform (list repos, private repo clone)'
    required: false
    default: ''
  dst_token:
    description: 'API token for the destination platform (look up / create repos)'
    required: false
    default: ''
  src_key:
    description: 'SSH private key for the source platform, only required when the src platform is gitee'
    required: false
    default: ''
  dst_key:
    description: 'SSH private key for the destination platform, only required when the dst platform is gitee'
    required: false
    default: ''
  src_endpoint:
    description: 'Self-hosted endpoint for the source platform, only used when the src platform is gitlab'
    required: false
    default: ''
  dst_endpoint:
    description: 'Self-hosted endpoint for the destination platform, only used when the dst platform is gitlab'
    required: false
    default: ''
  repo-names:
    description: 'Comma-separated repo names to mirror; if empty, mirrors every repo in src'
    required: false
    default: ''
  force:
    description: 'Force-push mirrored refs, overwriting divergent history on the destination'
    required: false
    default: 'true'
  workers:
    description: 'Number of repos to mirror concurrently'
    required: false
    default: '8'
  state-file:
    description: >-
      Path (relative to the workspace) to a JSON file mapping repo name to
      last-synced source branch sha. Read at the start and rewritten at the
      end with every processed repo's confirmed sha. Leave empty to disable
      state tracking. Persisting this file across runs (e.g. committing it
      back to the calling repo) is the caller's responsibility.
    required: false
    default: ''
  incremental:
    description: >-
      When "true" and state-file is set, skip repos whose current source sha
      still matches state-file without ever querying the destination
      platform. Leave "false" for a full sync that always checks the
      destination and refreshes state-file from the confirmed results.
    required: false
    default: 'false'
outputs:
  mirrored:
    description: 'Number of repos actually mirrored (excludes skipped repos that were already up to date)'
    value: ${{ steps.mirror.outputs.mirrored }}
  skipped:
    description: 'Number of repos skipped because they were already up to date'
    value: ${{ steps.mirror.outputs.skipped }}
  failed:
    description: 'Number of repos that failed to mirror'
    value: ${{ steps.mirror.outputs.failed }}
  total:
    description: 'Number of repos attempted'
    value: ${{ steps.mirror.outputs.total }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install funmirror
      shell: bash
      run: pip install --quiet "git+https://github.com/farfarfun/funmirror.git@v0.3.0"

    - id: mirror
      shell: bash
      env:
        SRC: ${{ inputs.src }}
        DST: ${{ inputs.dst }}
        SRC_KEY: ${{ inputs.src_key }}
        DST_KEY: ${{ inputs.dst_key }}
      run: |
        set -euo pipefail

        src_platform="${SRC%%/*}"
        src_org="${SRC#*/}"
        dst_platform="${DST%%/*}"
        dst_org="${DST#*/}"

        src_key_file=""
        dst_key_file=""

        if [[ "$src_platform" == "gitee" || "$dst_platform" == "gitee" ]]; then
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -t rsa,ed25519 gitee.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
        fi

        if [[ -n "$SRC_KEY" ]]; then
          src_key_file="$RUNNER_TEMP/mirror_src_key"
          printf '%s\n' "$SRC_KEY" > "$src_key_file"
          chmod 600 "$src_key_file"
        fi

        if [[ -n "$DST_KEY" ]]; then
          dst_key_file="$RUNNER_TEMP/mirror_dst_key"
          printf '%s\n' "$DST_KEY" > "$dst_key_file"
          chmod 600 "$dst_key_file"
        fi

        force_flag="--force"
        [[ "${{ inputs.force }}" == "true" ]] || force_flag="--no-force"

        incremental_flag=""
        [[ "${{ inputs.incremental }}" == "true" ]] && incremental_flag="--incremental"

        set +e
        funmirror mirror \
          --src-platform "$src_platform" --dst-platform "$dst_platform" \
          --src-org "$src_org" --dst-org "$dst_org" \
          --src-token "${{ inputs.src_token }}" --dst-token "${{ inputs.dst_token }}" \
          --src-key-file "$src_key_file" --dst-key-file "$dst_key_file" \
          --src-endpoint "${{ inputs.src_endpoint }}" --dst-endpoint "${{ inputs.dst_endpoint }}" \
          --repo-names "${{ inputs.repo-names }}" \
          --workers "${{ inputs.workers }}" \
          --state-file "${{ inputs.state-file }}" \
          $force_flag $incremental_flag
        status=$?
        set -e

        exit "$status"
